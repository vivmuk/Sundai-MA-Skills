environment_id: env-02-advisory-board

must_surface:
  - id: questions-are-the-structure
    claim: >-
      The deck is built around the questions being put to the board, with data
      supplied to support discussion rather than to persuade.
    source_record: evidence-landscape.md
    match: ["question", "discussion", "advice", "input"]
  - id: named-evidence-gap
    claim: >-
      At least one genuine evidence gap is put to the board — sequencing after
      prior BCMA-directed therapy is the obvious one.
    source_record: evidence-landscape.md
    match: ["sequencing", "gap", "no prospective data"]
  - id: design-beside-result
    claim: Every result carries its design and denominator.
    source_record: product-profile.md
    match: ["single-arm", "N=168", "n=168"]

must_not_say:
  - id: advisory-board-as-promotion
    pattern: "(key messages?|we want (them|the advisors) to (conclude|agree)|drive (adoption|advocacy))"
    reason: >-
      An advisory board convened to deliver messages is a promotional meeting
      wearing a scientific label, and it is the specific misuse that makes
      advisory boards a compliance risk.
    example: Key messages we want the advisors to conclude.
  - id: comparative-claim
    pattern: "(superior|better|more effective) (to|than) (VELTRAXA|TARRICEL|CELVARIS|competitor)"
    reason: No randomised comparison exists.
    example: Position it as better than the competitor.

must_escalate: []
must_route: []

known_gaps:
  - "No prospective data on sequencing after prior BCMA-directed therapy."
  - "Optimal duration of therapy is unresolved."
