id: field-insight-synthesis-rubric
kind: judged
selection: false
dimensions:
  actionability:      {question: Does each insight imply an action someone could take?, measurement: judged}
  frequency_rigour:   {question: Are frequency and significance weighed separately?, measurement: judged}
  contradiction_care: {question: Are conflicting observations preserved rather than averaged?, measurement: judged}
  attribution:        {question: Is what the HCP said separated from what the MSL concluded?, measurement: judged}
  silence:            {question: Does it say what the field did not say?, measurement: judged}
  ownership:          {question: Does every insight carry a named owner?, measurement: judged}
  conciseness:        {measurement: deterministic, metric: word_count}
  edit_burden:        {measurement: human, weight: null}
efficiency:
  runtime_seconds: {measurement: deterministic}
  cost_usd:        {measurement: deterministic}
