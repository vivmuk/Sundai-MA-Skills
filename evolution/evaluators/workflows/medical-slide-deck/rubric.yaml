id: medical-slide-deck-rubric
kind: judged
selection: false
dimensions:
  referencing:     {question: Does every data slide carry a reference?, measurement: judged}
  design_named:    {question: Is the design named beside every result?, measurement: judged}
  fair_balance:    {question: Are limitations at comparable prominence to benefits?, measurement: judged}
  backup_quality:  {question: Are backup slides built from anticipated questions?, measurement: judged}
  audience_fit:    {question: Is the deck shaped for the stated audience?, measurement: judged}
  conciseness:     {measurement: deterministic, metric: word_count}
  edit_burden:     {measurement: human, weight: null}
efficiency:
  runtime_seconds: {measurement: deterministic}
  cost_usd:        {measurement: deterministic}
