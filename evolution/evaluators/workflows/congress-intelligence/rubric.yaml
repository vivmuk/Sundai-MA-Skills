id: congress-intelligence-rubric
kind: judged
selection: false
dimensions:
  change_detection: {question: Does it identify what changed rather than what was presented?, measurement: judged}
  novelty_triage:   {question: Is genuinely new evidence separated from incremental updates?, measurement: judged}
  appraisal:        {question: Is abstract-tier evidence labelled and discounted appropriately?, measurement: judged}
  contradiction:    {question: Are conflicting readouts named rather than reconciled?, measurement: judged}
  actionability:    {question: Does it end with something to do, owned?, measurement: judged}
  conciseness:      {measurement: deterministic, metric: word_count}
  edit_burden:      {measurement: human, weight: null}
efficiency:
  runtime_seconds: {measurement: deterministic}
  cost_usd:        {measurement: deterministic}
