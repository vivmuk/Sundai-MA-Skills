name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Skill structure and sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install --quiet pyyaml

      - name: Check the generated index is current
        run: python3 scripts/build_index.py --check

      - name: Validate all skills
        run: python3 scripts/validate_skills.py

  apis:
    name: API clients (offline fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately no network here. These tests run against checked-in
      # fixtures so that a PubMed outage or an NCBI rate limit can never turn
      # CI red for a reason unrelated to the change under review.
      - name: Run offline API client tests
        run: python3 scripts/selftest_apis.py

  fallbacks:
    name: Graceful degradation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NO document libraries installed. This job proves every
      # content generator degrades visibly instead of failing, and that the
      # substantive content — citations, designs, denominators, safety data,
      # the draft marking — survives the fallback path.
      - name: Content generators must degrade, not fail
        run: python3 scripts/selftest_fallbacks.py

  workshop:
    name: Workshop behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test launch, sources, read-only data and failure paths
        run: python3 scripts/selftest_workshop.py

  evolution:
    name: Evolution Engine (mock adapter, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: pip install --quiet pyyaml

      # Deliberately no network and no API key. The engine runs against the
      # mock adapter and authored fixtures, so the whole suite is free and
      # cannot be turned red by an upstream outage or an expired key.
      - name: Engine behaviour
        run: python3 scripts/selftest_evolution.py

      # A full campaign end to end, for every active workflow: the band is
      # measured, candidates are run, gates fire, the tournament ranks, the
      # lineage records, and a promotion patch is produced that actually
      # applies to the real skill.
      - name: Full campaign against the mock adapter, every active workflow
        run: |
          set -e
          for wf in $(python3 -c "
          import yaml
          spec = yaml.safe_load(open('evolution/registry/workflows.yaml'))['workflows']
          print(' '.join(k for k, v in spec.items() if v.get('status') == 'active'))
          "); do
            echo "::group::$wf"
            python3 scripts/evolve.py probe "$wf" --adapter mock --yes
            python3 scripts/evolve.py run   "$wf" --adapter mock --yes
            python3 scripts/evolve.py tree  "$wf"
            python3 scripts/promote.py      "$wf"
            echo "::endgroup::"
          done
          for patch in evolution/experiments/promotion-*/proposal.patch; do
            git apply --check "$patch"
            echo "applies cleanly: $patch"
          done

      - name: The engine must not have touched a canonical skill
        run: |
          git diff --exit-code -- skills/ house-rules/ shared/ \
            evolution/constitution/ evolution/evaluators/global/

  live-apis:
    name: API clients (live — manual only)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Run this by hand when you want to know whether the upstream APIs have
      # changed shape. It is allowed to fail without blocking anyone, because
      # a third-party outage is not a defect in this repository.
      - name: Smoke-test against real APIs
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python3 scripts/selftest_apis.py --live
