name: import-upstream-once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream-once.yml"

permissions:
  contents: write

concurrency:
  group: import-upstream-once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Import upstream zipball at repo root
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="claude/medical-affairs-agent-workshop-ttpxhf"
          URL="https://codeload.github.com/Open-Medical-Affairs/Medical-Affairs-Skills/zip/refs/heads/${BRANCH}"
          echo "Downloading $URL"
          curl -fsSL -o /tmp/ma-skills.zip "$URL"
          file /tmp/ma-skills.zip
          ls -la /tmp/ma-skills.zip
          rm -rf /tmp/ma-skills-src
          mkdir -p /tmp/ma-skills-src
          unzip -q /tmp/ma-skills.zip -d /tmp/ma-skills-src
          SRC=$(find /tmp/ma-skills-src -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "SRC=$SRC"
          test -n "$SRC"
          test -d "$SRC/skills"
          if [ -f ORIGIN.md ]; then cp ORIGIN.md /tmp/ORIGIN.md.keep; fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .
          if [ -f /tmp/ORIGIN.md.keep ]; then cp /tmp/ORIGIN.md.keep ORIGIN.md; fi
          mkdir -p .github/workflows
          printf '%s\n' 'name: import-upstream-once' '' 'on:' '  workflow_dispatch:' '' 'jobs:' '  noop:' '    runs-on: ubuntu-latest' '    steps:' '      - run: echo done' > .github/workflows/import-upstream-once.yml
          echo "imported_from=Open-Medical-Affairs/Medical-Affairs-Skills@${BRANCH}" > .github/IMPORT-SOURCE.txt
          find . -type f ! -path './.git/*' | wc -l
          ls -la skills | head

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Import full Open-Medical-Affairs/Medical-Affairs-Skills (branch claude/medical-affairs-agent-workshop-ttpxhf)"
          git push origin HEAD:main
