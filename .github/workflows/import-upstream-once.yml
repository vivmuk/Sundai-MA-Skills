name: import-upstream-once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream-once.yml"

permissions:
  contents: write

concurrency:
  group: import-upstream-once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Checkout upstream source branch
        uses: actions/checkout@v4
        with:
          repository: Open-Medical-Affairs/Medical-Affairs-Skills
          ref: claude/medical-affairs-agent-workshop-ttpxhf
          path: _upstream

      - name: Replace working tree with upstream files
        shell: bash
        run: |
          set -eux
          if [ -f ORIGIN.md ]; then cp ORIGIN.md /tmp/ORIGIN.md.keep; fi
          rm -rf _upstream/.git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '_upstream' -exec rm -rf {} +
          cp -a _upstream/. .
          rm -rf _upstream
          if [ -f /tmp/ORIGIN.md.keep ]; then cp /tmp/ORIGIN.md.keep ORIGIN.md; fi
          mkdir -p .github/workflows
          printf '%s\n' 'name: import-upstream-once' '' 'on:' '  workflow_dispatch:' '' 'jobs:' '  noop:' '    runs-on: ubuntu-latest' '    steps:' '      - run: echo done' > .github/workflows/import-upstream-once.yml
          echo 'imported_from=Open-Medical-Affairs/Medical-Affairs-Skills@claude/medical-affairs-agent-workshop-ttpxhf' > .github/IMPORT-SOURCE.txt
          test -d skills
          test -f README.md
          test -f LICENSE
          test -f SKILLS-INDEX.md
          test -d .git
          find . -type f ! -path './.git/*' | wc -l

      - name: Commit and push
        shell: bash
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Import full Open-Medical-Affairs/Medical-Affairs-Skills (branch claude/medical-affairs-agent-workshop-ttpxhf)'
          git push origin HEAD:main
