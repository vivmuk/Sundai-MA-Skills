name: import-upstream-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download upstream zipball (no git clone)
        run: |
          set -euo pipefail
          BRANCH="claude/medical-affairs-agent-workshop-ttpxhf"
          curl -fsSL -o /tmp/ma-skills.zip \
            "https://api.github.com/repos/Open-Medical-Affairs/Medical-Affairs-Skills/zipball/${BRANCH}"
          rm -rf /tmp/ma-skills-src
          mkdir -p /tmp/ma-skills-src
          unzip -q /tmp/ma-skills.zip -d /tmp/ma-skills-src
          SRC=$(find /tmp/ma-skills-src -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "SRC=$SRC"

          # Preserve ORIGIN.md if present; otherwise create it
          if [ -f ORIGIN.md ]; then
            cp ORIGIN.md /tmp/ORIGIN.md.keep
          fi

          # Replace working tree with upstream contents at repo root (no wrapper dir)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SRC"/. .

          if [ -f /tmp/ORIGIN.md.keep ]; then
            cp /tmp/ORIGIN.md.keep ORIGIN.md
          else
            cat > ORIGIN.md << EOF
          # Origin

          This repository started as a copy of https://github.com/Open-Medical-Affairs/Medical-Affairs-Skills
          (default branch \`claude/medical-affairs-agent-workshop-ttpxhf\` at copy time) for local evolution in \`vivmuk/Sundai-MA-Skills\`.
          Original Apache-2.0 LICENSE and NOTICE are preserved.
          EOF
          fi

          # Inventory
          find . -type f ! -path './.git/*' | wc -l

      - name: Commit and push full import
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import full Open-Medical-Affairs/Medical-Affairs-Skills (branch claude/medical-affairs-agent-workshop-ttpxhf)"
          git push origin HEAD:main
