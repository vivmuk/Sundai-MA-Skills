name: import-upstream-once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream-once.yml"

permissions:
  contents: write

concurrency:
  group: import-upstream-once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: vivmuk/Medical-Affairs-Skills
          ref: refs/heads/claude/medical-affairs-agent-workshop-ttpxhf
          path: _upstream

      - name: Sync upstream files into repo root
        run: |
          set -eux
          ls -la _upstream | sed -n '1,20p'
          test -d _upstream/skills
          test -f _upstream/README.md
          cp -f ORIGIN.md /tmp/ORIGIN.md.keep || true
          rsync -a --delete --exclude '.git' --exclude '_upstream' _upstream/ ./
          if [ -f /tmp/ORIGIN.md.keep ]; then cp -f /tmp/ORIGIN.md.keep ORIGIN.md; fi
          mkdir -p .github/workflows
          printf '%s\n' 'name: import-upstream-once' '' 'on:' '  workflow_dispatch:' '' 'jobs:' '  noop:' '    runs-on: ubuntu-latest' '    steps:' '      - run: echo done' > .github/workflows/import-upstream-once.yml
          echo 'imported_from=vivmuk/Medical-Affairs-Skills@claude/medical-affairs-agent-workshop-ttpxhf' > .github/IMPORT-SOURCE.txt
          test -d skills
          test -f README.md
          test -f LICENSE
          test -f SKILLS-INDEX.md
          test -d .git
          find . -type f ! -path './.git/*' | wc -l

      - name: Commit and push
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Import full Medical-Affairs-Skills tree for local evolution'
          git push origin HEAD:main
