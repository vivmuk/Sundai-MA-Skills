# Trigger import run 2026-09-06
name: import-upstream-once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream-once.yml"

permissions:
  contents: write

concurrency:
  group: import-upstream-once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download public zipball by commit SHA
        run: |
          set -eux
          SHA=b688885a6e04ba00f7894a544391b525ee0a2e58
          curl -fsSL -o /tmp/ma.zip "https://codeload.github.com/Open-Medical-Affairs/Medical-Affairs-Skills/zip/${SHA}"
          mkdir -p /tmp/ma-src
          unzip -q /tmp/ma.zip -d /tmp/ma-src
          SRC=$(find /tmp/ma-src -mindepth 1 -maxdepth 1 -type d -print -quit)
          echo "SRC=$SRC"
          test -n "$SRC"
          test -d "$SRC/skills"
          test -f "$SRC/README.md"
          cp -f ORIGIN.md /tmp/ORIGIN.md.keep || true
          rsync -a --delete --exclude '.git' "$SRC"/ ./
          if [ -f /tmp/ORIGIN.md.keep ]; then cp -f /tmp/ORIGIN.md.keep ORIGIN.md; fi
          mkdir -p .github/workflows
          printf '%s\n' 'name: import-upstream-once' '' 'on:' '  workflow_dispatch:' '' 'jobs:' '  noop:' '    runs-on: ubuntu-latest' '    steps:' '      - run: echo done' > .github/workflows/import-upstream-once.yml
          echo "imported_from=Open-Medical-Affairs/Medical-Affairs-Skills@${SHA}" > .github/IMPORT-SOURCE.txt
          test -d skills
          test -f README.md
          test -f LICENSE
          test -f SKILLS-INDEX.md
          test -d .git
          find . -type f ! -path './.git/*' | wc -l

      - name: Commit and push
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Import full Open-Medical-Affairs/Medical-Affairs-Skills (commit b688885)'
          git push origin HEAD:main
